<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>cyph. one-pager</title>
    <link rel="icon" type="image/png" href="/common/favicon.png" />
    <meta property="og:title" content="cyph. one-pager" />
    <meta property="og:description" content="swag meets scholarship. the new underground." />
    <meta property="og:image" content="https://cyph.city/logo/og-image.png" />
    <meta property="og:url" content="https://investors.cyph.city/onepager/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/common/base.css" />
    <link rel="stylesheet" href="/common/viewer.css" />
  </head>
  <body>
    <div id="auth-gate" aria-label="access gate">
      <div class="auth-panel">
        <!-- reuses the same station-sign element shown on s4 — same dark
             placard, same C/Y/P/H route bullets — so the gate reads as
             slide zero of the deck rather than a separate auth screen -->
        <div class="station-sign auth-sign">
          <div class="station-name">we're the new underground.</div>
          <div class="station-bullets">
            <span class="station-bullet paprika">C</span
            ><span class="station-bullet cornflower">Y</span
            ><span class="station-bullet amber">P</span
            ><span class="station-bullet amaranth">H</span>
          </div>
        </div>
        <form id="auth-form" autocomplete="off">
          <input
            id="auth-input"
            type="email"
            inputmode="email"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="enter your email..."
          />
          <button type="submit">enter</button>
        </form>
        <div id="auth-err">&nbsp;</div>
        <div id="auth-retired" hidden>
          this version of the deck has been retired. ask us for the current link.
        </div>
      </div>
    </div>
    <div id="hudCtr" hidden></div>
    <script src="/common/auth.js" data-viewed="onepager"></script>
    <script
      src="/common/viewer.js"
      data-dir="pages/"
      data-pdf="cyph-onepager.pdf"
      data-pdf-label="download the pdf"
      data-alt="cyph one-pager"
    ></script>
  </body>
</html>
